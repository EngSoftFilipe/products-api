spring:
  application:
    name: products-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
  output:
    ansi:
      enabled: always
logging:
  pattern:
    console: "%highlight(%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n%ex)"