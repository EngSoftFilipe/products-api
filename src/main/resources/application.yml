spring:
  application:
    name: products-api
  datasource:
    url: jdbc:h2:mem:products
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console